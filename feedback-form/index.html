<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#091d4f">
<title>We want to make it right — CNAT Title</title>
<meta name="description" content="Your feedback helps us improve. Share what happened — we read every word and we'll reach out personally.">
<meta name="robots" content="noindex">

<meta property="og:type" content="website">
<meta property="og:url" content="https://cnattitle.tech/feedback-form">
<meta property="og:title" content="We want to make it right — CNAT Title">
<meta property="og:description" content="Tell us what happened. We read every word.">
<meta property="og:image" content="https://cnattitle.tech/assets/og-review.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cnattitle.tech/assets/og-review.png">

<link rel="icon" href="/assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css?v=2">
</head>
<body>
<main class="container">
  <header class="brand-bar">
    <a class="brand-logo" href="https://cnattitle.com" aria-label="CNAT Title — Community National Title">
      <img src="/assets/cnat-logo-white.png?v=2" alt="CNAT Title">
    </a>
  </header>

  <section class="hero">
    <h1>We want to<br><span class="accent">make it right.</span></h1>
    <p class="lead">Your feedback helps us improve. Tell us what happened — we read every word and we'll reach out personally.</p>
  </section>

  <form class="form-card" id="feedbackForm" novalidate>
    <div class="form-row">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your full name" required>
    </div>
    <div class="form-row">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required>
    </div>
    <div class="form-row">
      <label for="phone">Phone <span style="color:var(--muted);text-transform:none;letter-spacing:0;font-size:11px;">(optional)</span></label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(555) 555-5555">
    </div>
    <div class="form-row">
      <label for="property">Property address</label>
      <input id="property" name="property" type="text" autocomplete="street-address" placeholder="e.g. 123 Main St, Dallas, TX" required>
    </div>
    <div class="form-row">
      <label for="message">What happened?</label>
      <textarea id="message" name="message" placeholder="Tell us about your experience..." required></textarea>
    </div>
    <div class="form-error" id="formError" role="alert"></div>
    <button class="btn" type="submit" id="submitBtn">Send feedback</button>
  </form>

  <footer class="footer">
    <div class="footer-tag">#AlwaysBeClosing <span class="gold">· Texas Style</span></div>
    <div>© Community National Title · <a href="/review">← back</a></div>
  </footer>
</main>

<script>
(function() {
  // Posts to n8n workflow "CNAT cnattitle.tech — Review Feedback → GHL" (id jV8NSQOhdHXovMks)
  // Flow: webhook → upsert GHL contact (CNAT) → add note → email marketing@cnattitle.com → respond OK
  var WEBHOOK_URL = "https://n8n.cnattitle.tech/webhook/cnat-web-review-feedback";

  var form = document.getElementById('feedbackForm');
  var btn = document.getElementById('submitBtn');
  var err = document.getElementById('formError');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    err.classList.remove('visible');
    err.textContent = '';

    var payload = {
      source: 'cnattitle.tech/feedback-form',
      submitted_at: new Date().toISOString(),
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      property_address: document.getElementById('property').value.trim(),
      message: document.getElementById('message').value.trim()
    };

    if (!payload.name || !payload.email || !payload.property_address || !payload.message) {
      err.textContent = 'Please fill in all required fields.';
      err.classList.add('visible');
      return;
    }

    btn.disabled = true;
    var originalText = btn.textContent;
    btn.textContent = 'Sending…';

    try {
      var res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      // GHL inbound webhooks generally return 200 quickly; we proceed regardless of body
      if (!res.ok && res.status !== 0) {
        throw new Error('Server responded ' + res.status);
      }
      window.location.href = '/thank-you';
    } catch (ex) {
      // Even with CORS / opaque responses, the data usually lands. Best-effort fallback:
      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        window.location.href = '/thank-you';
      } catch (e2) {
        err.textContent = "We couldn't send that — please try again, or email us directly at hello@cnattitle.com.";
        err.classList.add('visible');
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
  });
})();
</script>
</body>
</html>
