<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG · cnattitle.tech/review</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* 1200 x 630 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 1200px; height: 630px;
    background: #0a0e16;
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
  }
  .bg-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 80% at 100% 0%, rgba(250,237,54,0.14), transparent 65%),
      radial-gradient(ellipse 60% 85% at 0% 100%, rgba(45,125,210,0.10), transparent 65%);
    pointer-events: none;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,0,0,0.85) 40%, transparent 90%);
  }
  .frame {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    padding: 60px 72px;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
  }
  .logo { width: 220px; }
  .logo img { width: 100%; display: block; }

  .stars-block {
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .stars {
    display: flex; gap: 10px;
    color: #faed36;
    line-height: 1;
  }
  .stars svg { width: 38px; height: 38px; display: block; }
  .stars-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #b9c2d4;
    font-weight: 600;
  }

  .middle {
    display: flex; flex-direction: column;
    justify-content: center;
    max-width: 980px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 88px;
    line-height: 1.02;
    letter-spacing: -2.5px;
  }
  h1 .accent { color: #faed36; font-weight: 700; }
  .lead {
    margin-top: 26px;
    font-size: 28px;
    line-height: 1.45;
    color: #b9c2d4;
    font-weight: 400;
    max-width: 880px;
  }

  .bottom {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .url {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .url .tld { color: #faed36; }
  .url .path { color: #5d6679; }
  .tag {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #b9c2d4;
    font-weight: 700;
  }
  .tag .gold { color: #faed36; }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="grid"></div>

  <div class="frame">
    <div class="top">
      <div class="logo">
        <img src="../assets/cnat-logo-white.png" alt="CNAT Title">
      </div>
      <div class="stars-block">
        <div class="stars">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
        <div class="stars-label">Tap to rate</div>
      </div>
    </div>

    <div class="middle">
      <h1>Thanks for <span class="accent">closing</span><br>with us.</h1>
      <p class="lead">How was your experience? Two taps, sixty seconds &mdash; and you help the next family find a title team that actually shows up.</p>
    </div>

    <div class="bottom">
      <div class="url">cnattitle<span class="tld">.tech</span><span class="path">/review</span></div>
      <div class="tag">#AlwaysBeClosing <span class="gold">&middot; Texas Style</span></div>
    </div>
  </div>
</body>
</html>
